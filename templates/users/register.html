{% extends 'base.html' %}{% block content %}<div class="auth-wrap"><div class="auth-panel wide"><p class="eyebrow text-orange">START EXPLORING</p><h1>Create your travel profile.</h1><form method="post" class="row g-3">{% csrf_token %}{% for field in form %}<div class="{% if field.name in 'first_name,last_name,phone,city,country' %}col-md-6{% else %}col-12{% endif %}"><label class="form-label">{{ field.label }}</label>{{ field }}{% for error in field.errors %}<div class="text-danger small">{{ error }}</div>{% endfor %}</div>{% endfor %}<div class="col-12"><button class="btn btn-sun">Create account →</button></div></form><p class="small mt-4">Already have an account? <a href="{% url 'login' %}">Log in</a></p></div></div>{% endblock %}
