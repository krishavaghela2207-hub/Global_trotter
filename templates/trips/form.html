{% extends 'base.html' %}{% block content %}<div class="container py-5 narrow"><p class="eyebrow text-orange">NEW ADVENTURE</p><h1>{{ title }}</h1><p class="text-muted">Give your trip a foundation. You can add stops and activities afterwards.</p><div class="card form-card mt-4"><form method="post" enctype="multipart/form-data" class="row g-3">{% csrf_token %}{% for field in form %}<div class="{% if field.name in 'start_date,end_date,status,visibility,planned_budget,currency' %}col-md-6{% else %}col-12{% endif %}"><label class="form-label">{{ field.label }}</label>{{ field }}{% for error in field.errors %}<div class="text-danger small">{{ error }}</div>{% endfor %}</div>{% endfor %}<div class="col-12"><button class="btn btn-sun btn-lg">Create trip →</button></div></form></div></div>{% endblock %}
