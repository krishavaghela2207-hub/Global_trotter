{% extends 'base.html' %}

{% block title %}Verify Account – GlobeTrotter{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center align-items-center min-vh-75">
    <div class="col-12 col-md-8 col-lg-5 text-center">
      
      <div class="card gt-card border-0 shadow-lg rounded-4 p-5">
        <div class="d-inline-flex p-4 rounded-circle bg-primary bg-opacity-10 text-primary mb-4 mx-auto">
          <i class="fas fa-shield-check fs-1"></i>
        </div>

        <h2 class="fw-bold text-dark mb-2">Email Verification</h2>
        <p class="text-muted small mb-4">Paste your verification token below to verify your GlobeTrotter account.</p>

        <form method="POST" action="{% url 'verify_email' %}">
          {% csrf_token %}
          <div class="mb-3">
            <input type="text" name="token" class="form-control text-center py-2" placeholder="Paste verification token here" required>
          </div>
          <button type="submit" class="btn btn-gt-primary w-100 py-2 fw-bold">
            Verify & Continue <i class="fas fa-arrow-right ms-1"></i>
          </button>
        </form>
      </div>

    </div>
  </div>
</div>
{% endblock %}
