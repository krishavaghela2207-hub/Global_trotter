{% extends 'base.html' %}

{% block title %}Set New Password – GlobeTrotter{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center align-items-center min-vh-75">
    <div class="col-12 col-md-8 col-lg-5">
      
      <div class="card gt-card border-0 shadow-lg rounded-4 p-4 p-md-5">
        <div class="text-center mb-4">
          <div class="d-inline-flex p-3 rounded-circle bg-primary bg-opacity-10 text-primary mb-3">
            <i class="fas fa-lock-keyhole fs-2"></i>
          </div>
          <h2 class="fw-bold text-dark">Create New Password</h2>
          <p class="text-muted small">Enter your new secure password below</p>
        </div>

        <form method="POST" action="{% url 'password_reset_confirm' token=token %}">
          {% csrf_token %}
          <input type="hidden" name="username" value="{{ request.GET.user }}">

          <div class="mb-3">
            <label class="form-label fw-semibold text-dark small">New Password</label>
            <input type="password" name="new_password" class="form-control" placeholder="Minimum 6 characters" required autofocus>
          </div>

          <div class="mb-4">
            <label class="form-label fw-semibold text-dark small">Confirm New Password</label>
            <input type="password" name="confirm_password" class="form-control" placeholder="Re-enter password" required>
          </div>

          <button type="submit" class="btn btn-gt-primary w-100 py-2 fw-bold">
            Update Password & Log In
          </button>
        </form>
      </div>

    </div>
  </div>
</div>
{% endblock %}
