{% extends 'base.html' %}

{% block title %}Reset Password – GlobeTrotter{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center align-items-center min-vh-75">
    <div class="col-12 col-md-8 col-lg-5">
      
      <div class="card gt-card border-0 shadow-lg rounded-4 p-4 p-md-5">
        <div class="text-center mb-4">
          <div class="d-inline-flex p-3 rounded-circle bg-warning bg-opacity-10 text-warning mb-3">
            <i class="fas fa-key fs-2"></i>
          </div>
          <h2 class="fw-bold text-dark">Reset Password</h2>
          <p class="text-muted small">Enter your account email to receive a password reset link</p>
        </div>

        <form method="POST" action="{% url 'password_reset' %}">
          {% csrf_token %}
          <div class="mb-3">
            <label class="form-label fw-semibold text-dark small">Email Address</label>
            <div class="input-group">
              <span class="input-group-text bg-light border-end-0 text-muted"><i class="fas fa-envelope"></i></span>
              <input type="email" name="email" class="form-control border-start-0" placeholder="name@example.com" required autofocus>
            </div>
          </div>
          <button type="submit" class="btn btn-gt-primary w-100 py-2 fw-bold">Send Reset Link</button>
        </form>

        <div class="text-center mt-4 pt-3 border-top">
          <a href="{% url 'login' %}" class="text-muted small text-decoration-none">&larr; Back to Login</a>
        </div>
      </div>

    </div>
  </div>
</div>
{% endblock %}
