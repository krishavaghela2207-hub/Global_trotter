{% extends 'base.html' %}{% block content %}<div class="container py-5 narrow"><p class="eyebrow text-orange">{{ stop.city.name|upper }}</p><h1>Add an itinerary activity</h1><p class="text-muted">Activities are reusable master data; your custom timing and cost are saved only to this trip.</p><div class="card form-card mt-4"><form method="post" class="row g-3">{% csrf_token %}{% for field in form %}<div class="col-md-6"><label class="form-label">{{ field.label }}</label>{{ field }}{{ field.errors }}</div>{% endfor %}<div class="col-12"><button class="btn btn-sun">Add to itinerary →</button></div></form></div></div>{% endblock %}
